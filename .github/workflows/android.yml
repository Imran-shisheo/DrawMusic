name: Android checks and test APK
on:
  push:
    # Development branches run through pull_request, avoiding duplicate emulator jobs.
    branches: [main]
  pull_request:
    # Stacked redesign includes every unmerged audit fix.
    branches: [main, codex/review-fixes-2026-10-27]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  # Preserve a running native soak while a diagnostic/docs update is queued.
  # The conservative gate proof prevents an untested queued head being skipped.
  cancel-in-progress: false
jobs:
  setup-files:
    name: Validate setup and detect Flutter project
    runs-on: ubuntu-24.04
    outputs:
      app_exists: ${{ steps.detect.outputs.app_exists }}
      product_changed: ${{ steps.changes.outputs.product_changed }}
      native_required: ${{ steps.native-proof.outputs.native_required }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changes
        name: Detect product changes conservatively
        env:
          DRAWMUSIC_GATE_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/test-product-change.py
          python3 scripts/detect-product-change.py
      - id: native-proof
        name: Verify exact native source acceptance before reusing it
        env:
          DRAWMUSIC_GATE_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/test-native-source-proof.py
          python3 scripts/native-source-proof.py
      - name: Check setup syntax
        run: |
          bash -n cloud/env.sh scripts/setup-cloud-android.sh scripts/check-android.sh scripts/prepare-runtime-inspectors.sh scripts/check-ios-audio-state.sh
          python3 -m py_compile scripts/run-android-ui.py scripts/prepare-offline-emulator.py scripts/validate-video.py
          python3 -m json.tool .fvmrc > /dev/null
      - id: detect
        shell: bash
        run: |
          if [[ -f pubspec.yaml ]]; then
            echo 'app_exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'app_exists=false' >> "$GITHUB_OUTPUT"
            echo 'Setup-only repository. Flutter checks and APK build are skipped until cloud bootstrap.' >> "$GITHUB_STEP_SUMMARY"
          fi
  swift-audio-state:
    name: Pure Swift audio state (Linux; not iOS runtime)
    needs: setup-files
    if: needs.setup-files.outputs.app_exists == 'true' && needs.setup-files.outputs.product_changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Execute render-used scheduling and reset policy regressions
        run: bash scripts/check-ios-audio-state.sh
      - name: Upload portable Swift evidence (not iOS runtime)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: drawmusic-swift-state-${{ github.sha }}
          path: |
            work/ios-audio-state/compiler.log
            work/ios-audio-state/tests.log
            work/ios-audio-state/grammar.log
          if-no-files-found: warn
          retention-days: 7
  android:
    name: Analyze, test and build Android
    needs: setup-files
    if: needs.setup-files.outputs.app_exists == 'true' && needs.setup-files.outputs.product_changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Make room for Android emulator on disposable runner
        run: bash scripts/free-hosted-runner-space.sh
      - name: Prepare pinned Flutter and Android SDK
        run: bash scripts/setup-cloud-android.sh
      - name: Format, analyze, test and build
        run: bash scripts/check-android.sh
      - name: Verify product APK signature
        run: |
          source cloud/env.sh
          "$ANDROID_HOME/build-tools/$DRAWMUSIC_ANDROID_BUILD_TOOLS/apksigner" verify --verbose build/app/outputs/flutter-apk/app-debug.apk
      - name: Upload installable test APK
        uses: actions/upload-artifact@v7
        with:
          name: drawmusic-android-debug-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - uses: actions/setup-python@v6
        if: needs.setup-files.outputs.native_required != 'false'
        with:
          python-version: '3.12'
      - name: Prepare independent media inspectors
        if: needs.setup-files.outputs.native_required != 'false'
        timeout-minutes: 10
        run: bash scripts/prepare-runtime-inspectors.sh
      - name: Generate original runtime fixtures
        if: needs.setup-files.outputs.native_required != 'false'
        run: |
          source cloud/env.sh
          export DASH__SUPPRESS_ANALYTICS=true
          dart run tool/export_fixture.dart work/runtime-fixtures
      - name: Release build memory before emulator startup
        if: needs.setup-files.outputs.native_required != 'false'
        run: |
          source cloud/env.sh
          cd android
          ./gradlew --stop
      - name: Verify bounded runtime diagnostic host regressions
        run: |
          python3 -m py_compile scripts/run-android-ui.py scripts/runtime_transport_diagnostics.py scripts/test-runtime-transport-diagnostics.py scripts/inspect-runtime-artifact.py scripts/test-runtime-artifact-inspect.py
          python3 scripts/test-runtime-transport-diagnostics.py
          python3 scripts/test-observe-emulator-process.py
          python3 scripts/test-runtime-artifact-inspect.py
      - name: Enable emulator acceleration
        if: needs.setup-files.outputs.native_required != 'false'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise real Android audio and video APIs
        id: runtime_emulator
        if: needs.setup-files.outputs.native_required != 'false'
        timeout-minutes: 40
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          pre-emulator-launch-script: python3 scripts/observe-emulator-process.py install --mode runtime
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/check-android-runtime.sh
      - name: Retain owned emulator lifecycle and scoped crash diagnostics
        if: ${{ always() && steps.runtime_emulator.outcome != 'skipped' && needs.setup-files.outputs.native_required != 'false' }}
        timeout-minutes: 1
        run: python3 scripts/observe-emulator-process.py collect --mode runtime
      - name: Inspect encoded audio, video and cursor timing
        timeout-minutes: 10
        if: ${{ !cancelled() && needs.setup-files.outputs.native_required != 'false' }}
        run: |
          export PYTHONPATH="$PWD/work/validation-deps"
          python3 scripts/validate-video.py work/runtime-output/fixture-video.mp4 work/runtime-fixtures/original-loop.wav work/runtime-output/inspection.json
          python3 scripts/validate-video.py work/runtime-output/ui-export-video.mp4 work/runtime-output/ui-export-audio.wav work/runtime-output/ui-inspection.json 640
          python3 scripts/validate-video.py work/runtime-output/fixture-video-60.mp4 work/runtime-fixtures/original-loop.wav work/runtime-output/video-60-inspection.json 640 60
          python3 scripts/validate-video.py work/runtime-output/fixture-video-hd-60.mp4 work/runtime-fixtures/original-loop.wav work/runtime-output/video-hd-60-inspection.json 1080 60
          python3 scripts/validate-runtime-midi.py
          python3 scripts/validate-runtime-png.py
          python3 scripts/validate-video.py work/runtime-output/expanded-video.mp4 work/runtime-output/expanded-audio.wav work/runtime-output/expanded-video-inspection.json 640
          python3 scripts/validate-expanded-midi.py
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.setup-files.outputs.native_required != 'false' && 'drawmusic-runtime-evidence' || 'drawmusic-core-evidence' }}-${{ github.sha }}
          path: |
            work/runtime-output/
            test/failures/
            work/ui-golden-verification/
            build/app/reports/androidTests/
            build/app/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 7
