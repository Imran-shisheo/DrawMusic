name: Android checks and test APK
on:
  push:
    # Development branches run through pull_request, avoiding duplicate emulator jobs.
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  setup-files:
    name: Validate setup and detect Flutter project
    runs-on: ubuntu-24.04
    outputs:
      app_exists: ${{ steps.detect.outputs.app_exists }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check setup syntax
        run: |
          bash -n cloud/env.sh scripts/setup-cloud-android.sh scripts/check-android.sh
          python3 -m json.tool .fvmrc > /dev/null
      - id: detect
        shell: bash
        run: |
          if [[ -f pubspec.yaml ]]; then
            echo 'app_exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'app_exists=false' >> "$GITHUB_OUTPUT"
            echo 'Setup-only repository. Flutter checks and APK build are skipped until cloud bootstrap.' >> "$GITHUB_STEP_SUMMARY"
          fi
  android:
    name: Analyze, test and build Android
    needs: setup-files
    if: needs.setup-files.outputs.app_exists == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Make room for Android emulator on disposable runner
        run: bash scripts/free-hosted-runner-space.sh
      - name: Prepare pinned Flutter and Android SDK
        run: bash scripts/setup-cloud-android.sh
      - name: Format, analyze, test and build
        run: bash scripts/check-android.sh
      - name: Upload installable test APK
        uses: actions/upload-artifact@v7
        with:
          name: drawmusic-android-debug-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Generate original runtime fixtures
        run: |
          source cloud/env.sh
          export DASH__SUPPRESS_ANALYTICS=true
          dart run tool/export_fixture.dart work/runtime-fixtures
      - name: Release build memory before emulator startup
        run: |
          source cloud/env.sh
          cd android
          ./gradlew --stop
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise real Android audio and video APIs
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/check-android-runtime.sh
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Inspect encoded audio, video and cursor timing
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir --target work/validation-deps numpy==2.2.6 mido==1.3.3
          export PYTHONPATH="$PWD/work/validation-deps"
          python3 scripts/validate-video.py work/runtime-output/fixture-video.mp4 work/runtime-fixtures/original-loop.wav work/runtime-output/inspection.json
          python3 scripts/validate-video.py work/runtime-output/ui-export-video.mp4 work/runtime-output/ui-export-audio.wav work/runtime-output/ui-inspection.json 640
          python3 scripts/validate-runtime-midi.py
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: drawmusic-runtime-evidence-${{ github.sha }}
          path: |
            work/runtime-output/
            build/app/reports/androidTests/
            build/app/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 7
