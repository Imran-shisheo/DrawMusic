name: Inspect private UI capture evidence (read only)
on:
  push:
    branches: [codex/ui-redesign-2026-10-27, codex/graphite-evidence-reader-2026-10-29]
    paths:
      - .github/workflows/ui-capture-inspect.yml
      - cloud/ui-capture-inspect.json
      - scripts/inspect-ui-capture.py
      - scripts/inspect-runtime-artifact.py
      - scripts/test-runtime-artifact-inspect.py
      - scripts/emulator_lldb_trace.py
      - scripts/check-host-debugger-readiness.py
      - scripts/test-host-debugger-readiness.py
      - scripts/emulator_process_inspection.py
      - scripts/inspect-emulator-fault-artifact.py
      - scripts/test-emulator-fault-artifact-inspect.py
      - scripts/owned_pc_mapping.py
      - scripts/test-owned-pc-mapping.py
      - scripts/check-execchain-debugger-readiness.py
      - scripts/test-execchain-debugger-readiness.py
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: request
        name: Read bounded diagnostic artifact request
        run: |
          python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          request=json.loads(Path('cloud/ui-capture-inspect.json').read_text())
          assert type(request['runId']) is int and request['runId']>0
          mode=request.get('mode','ui')
          assert mode in ('ui','runtime','emulator-fault','ui-transport')
          artifact_id=''
          name=request['artifactName']
          if mode in ('runtime','emulator-fault','ui-transport'):
              import importlib.util,sys
              sys.path.insert(0,str(Path('scripts').resolve()))
              filename='scripts/inspect-runtime-artifact.py' if mode=='runtime' else 'scripts/inspect-emulator-fault-artifact.py'
              spec=importlib.util.spec_from_file_location('runtime_inspect',filename)
              helper=importlib.util.module_from_spec(spec)
              spec.loader.exec_module(helper)
              helper.validate_request(request)
              artifact_id=str(request['artifactId'])
              name=''
          else:
              assert isinstance(name,str) and re.fullmatch(r'drawmusic-ui-visuals-[0-9a-f]{40}',name)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write(f"run={request['runId']}\nname={name}\nartifact_id={artifact_id}\nmode={mode}\n")
          PY
      - uses: actions/download-artifact@v5
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.request.outputs.run }}
          name: ${{ steps.request.outputs.name }}
          artifact-ids: ${{ steps.request.outputs.artifact_id }}
          merge-multiple: true
          path: work/ui-capture-inspect
      - name: Prepare required video inspectors
        if: steps.request.outputs.mode == 'ui'
        timeout-minutes: 8
        run: bash scripts/prepare-runtime-inspectors.sh --video-only
      - name: Verify bounded runtime reader regressions
        run: |
          python3 scripts/test-runtime-artifact-inspect.py
          python3 scripts/test-emulator-fault-artifact-inspect.py
      - name: Check preinstalled host debugger readiness (diagnostic only)
        if: steps.request.outputs.mode != 'emulator-fault' && steps.request.outputs.mode != 'ui-transport'
        timeout-minutes: 3
        run: |
          python3 scripts/test-host-debugger-readiness.py
          python3 scripts/test-owned-pc-mapping.py
          python3 scripts/test-execchain-debugger-readiness.py
          python3 scripts/check-host-debugger-readiness.py
          python3 scripts/check-execchain-debugger-readiness.py
      - name: Preserve bounded host debugger readiness
        if: ${{ always() && steps.request.outputs.mode != 'emulator-fault' && steps.request.outputs.mode != 'ui-transport' }}
        uses: actions/upload-artifact@v7
        with:
          name: drawmusic-host-debugger-readiness-${{ github.sha }}
          path: work/ui-capture-inspect-debugger/
          if-no-files-found: warn
          retention-days: 7
      - name: Inspect bounded native runtime logs (not a product test)
        if: steps.request.outputs.mode == 'runtime'
        run: python3 scripts/inspect-runtime-artifact.py
      - name: Inspect fixed owned SDK debugger evidence (never acceptance)
        if: steps.request.outputs.mode == 'emulator-fault' || steps.request.outputs.mode == 'ui-transport'
        run: python3 scripts/inspect-emulator-fault-artifact.py
      - name: Inspect actual diagnostic logs and requested exact PNGs (not a product test)
        if: steps.request.outputs.mode == 'ui'
        run: python3 scripts/inspect-ui-capture.py
